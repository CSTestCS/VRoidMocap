name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Download models
        run: python scripts/fetch_models.py

      - name: Self-test (core pipeline on synthetic data)
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: pyinstaller --noconfirm VRoidMocap.spec

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\VRoidMocap.exe -ArgumentList "--browser","--port","8799" -PassThru
          Start-Sleep -Seconds 25
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/state
          Write-Host $r.Content
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VRoidMocap-windows
          path: dist/VRoidMocap.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VRoidMocap.exe
